<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Top Dark Forest Green Circular Arc -->
  <path d="M 85 285 A 190 190 0 1 1 415 285" fill="none" stroke="#0F3020" stroke-width="8" stroke-linecap="round" />

  <!-- Holstein Cow Head & Shoulders -->
  <g transform="translate(100, 70)">
    <!-- Ears -->
    <!-- Left Ear -->
    <path d="M 50 85 C 10 70 0 95 30 115 C 55 125 70 105 75 95 Z" fill="#1A1A1A" />
    <path d="M 45 88 C 25 80 18 95 35 108 C 48 114 58 102 60 95 Z" fill="#E8B4B8" opacity="0.6" />

    <!-- Right Ear -->
    <path d="M 250 85 C 290 70 300 95 270 115 C 245 125 230 105 225 95 Z" fill="#1A1A1A" />
    <path d="M 255 88 C 275 80 282 95 265 108 C 252 114 242 102 240 95 Z" fill="#E8B4B8" opacity="0.6" />

    <!-- Small Horns -->
    <path d="M 80 65 C 75 40 95 35 100 50 C 95 58 88 62 80 65 Z" fill="#F4EFE6" stroke="#1A1A1A" stroke-width="2" />
    <path d="M 220 65 C 225 40 205 35 200 50 C 205 58 212 62 220 65 Z" fill="#F4EFE6" stroke="#1A1A1A" stroke-width="2" />

    <!-- Head Outline / Base -->
    <!-- Black Patches Base -->
    <path d="M 85 70 C 110 65 190 65 215 70 C 240 100 255 160 235 230 C 220 280 200 295 180 300 C 120 300 100 280 85 230 C 65 160 80 100 85 70 Z" fill="#1A1A1A" />

    <!-- White Forehead Blaze & Muzzle -->
    <path d="M 150 66 C 130 95 125 140 145 155 C 160 165 165 175 140 210 C 125 230 120 260 130 280 C 138 296 162 296 170 280 C 180 260 175 230 160 210 C 135 175 140 165 155 155 C 175 140 170 95 150 66 Z" fill="#FFFFFF" />

    <!-- Eyes -->
    <ellipse cx="110" cy="145" rx="8" ry="12" fill="#FFFFFF" />
    <circle cx="110" cy="146" r="6" fill="#1A1A1A" />
    <circle cx="108" cy="143" r="2" fill="#FFFFFF" />

    <ellipse cx="190" cy="145" rx="8" ry="12" fill="#FFFFFF" />
    <circle cx="190" cy="146" r="6" fill="#1A1A1A" />
    <circle cx="188" cy="143" r="2" fill="#FFFFFF" />

    <!-- Nostrils and Mouth -->
    <ellipse cx="138" cy="275" rx="7" ry="10" transform="rotate(-15 138 275)" fill="#1A1A1A" />
    <ellipse cx="162" cy="275" rx="7" ry="10" transform="rotate(15 162 275)" fill="#1A1A1A" />
    <path d="M 135 290 Q 150 298 165 290" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Grass Bush / Sprig at the bottom right of the cow -->
  <g stroke="#16A34A" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M 330 350 Q 345 300 365 260" />
    <path d="M 345 315 Q 365 305 380 300" />
    <path d="M 355 285 Q 375 270 385 260" />
    <path d="M 365 260 Q 380 245 390 230" />
  </g>

  <!-- Grass Tufts Platform -->
  <path d="M 60 365 
           L 75 345 L 85 365 L 105 340 L 115 365 L 135 335 L 150 365 
           L 175 330 L 190 365 L 210 328 L 230 365 L 250 325 L 270 365 
           L 290 328 L 310 365 L 335 332 L 350 365 L 375 338 L 390 365 
           L 410 342 L 420 365 L 435 348 L 445 365
           L 445 385 L 60 385 Z" fill="#16A34A" />

  <!-- Forest Green Ribbon Banner with Swallowtail Ends -->
  <g filter="url(#shadow)">
    <!-- Left Swallowtail folded back -->
    <path d="M 50 410 L 25 375 L 50 345 L 85 365 L 85 410 Z" fill="#081C13" />
    <path d="M 25 375 L 5 390 L 25 405 L 50 410 L 50 345 Z" fill="#0F3020" />

    <!-- Right Swallowtail folded back -->
    <path d="M 450 410 L 475 375 L 450 345 L 415 365 L 415 410 Z" fill="#081C13" />
    <path d="M 475 375 L 495 390 L 475 405 L 450 410 L 450 345 Z" fill="#0F3020" />

    <!-- Main Front Ribbon -->
    <path d="M 55 358 Q 250 340 445 358 L 430 422 Q 250 405 70 422 Z" fill="#0F3020" stroke="#16A34A" stroke-width="1.5" />

    <!-- Text on Ribbon: MOO & MORE DAIRY FARM -->
    <text x="250" y="394" 
          font-family="'Fraunces', 'Arial Black', sans-serif" 
          font-size="25" 
          font-weight="900" 
          letter-spacing="2" 
          fill="#FFFFFF" 
          text-anchor="middle">
      MOO &amp; MORE DAIRY FARM
    </text>
  </g>

  <!-- Tagline underneath: Its all about quality in italic script -->
  <text x="250" y="468" 
        font-family="'Caveat', 'Dancing Script', 'Brush Script MT', cursive" 
        font-size="36" 
        font-weight="700" 
        font-style="italic" 
        fill="#0F3020" 
        text-anchor="middle">
    Its all about quality
  </text>
</svg>
